<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Menu — Stripe style</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          ink: '#0A2540',
          slate: '#425466',
          faint: '#8792A2',
          blurple: '#635BFF',
          hair: '#E6E9EF',
          wash: '#F7F9FC',
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/morph/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs/dist/cdn.min.js"></script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
  .item-row { transition: background-color .15s ease; }
  .item-row:hover .item-icon { transform: translateY(-1px); }
  .item-icon { transition: transform .2s cubic-bezier(0.16,1,0.3,1); }
  .arrow { transition: transform .2s cubic-bezier(0.16,1,0.3,1); }
  .item-row:hover .arrow { transform: translateX(3px); }
  .fade-in { animation: fadeIn .28s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
</style>
</head>

<body class="bg-wash min-h-screen">

<!-- Page filler content so the menu has something to sit above -->
<div class="pointer-events-none select-none opacity-0 h-0">spacer</div>

<nav
    x-data="megaMenu()"
    @keydown.escape.window="close(true)"
    @mouseleave="scheduleClose()"
    class="relative bg-white/90 backdrop-blur border-b border-hair sticky top-0 z-40"
>
    <!-- Top Nav -->
    <div class="max-w-6xl mx-auto flex items-center gap-1 px-6">
        <div class="flex items-center gap-2 mr-8 py-4">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="#635BFF"/>
                <path d="M16.5 9c-3 0-5 1.6-5 4.2 0 2.3 1.8 3.2 3.9 3.9 1.9.6 2.6.9 2.6 1.8 0 .9-.9 1.4-2.1 1.4-1.6 0-3.1-.6-4.2-1.5l-.9 2.6c1.2 1 3.1 1.6 5 1.6 3.2 0 5.3-1.7 5.3-4.3 0-2.5-1.9-3.4-4-4-1.8-.6-2.6-.9-2.6-1.7 0-.8.8-1.2 1.9-1.2 1.3 0 2.6.4 3.7 1.2l.9-2.5C19.8 9.4 18.2 9 16.5 9z" fill="white"/>
            </svg>
            <span class="font-semibold text-ink tracking-tight">Meridian</span>
        </div>

        <button
            @mouseenter="load('products', $el)"
            @click="load('products', $el)"
            :class="active === 'products' ? 'text-ink' : 'text-slate hover:text-ink'"
            class="relative px-4 py-4 text-[14.5px] font-medium transition-colors"
        >
            Products
        </button>

        <button
            @mouseenter="load('solutions', $el)"
            @click="load('solutions', $el)"
            :class="active === 'solutions' ? 'text-ink' : 'text-slate hover:text-ink'"
            class="relative px-4 py-4 text-[14.5px] font-medium transition-colors"
        >
            Solutions
        </button>

        <button
            @mouseenter="load('resources', $el)"
            @click="load('resources', $el)"
            :class="active === 'resources' ? 'text-ink' : 'text-slate hover:text-ink'"
            class="relative px-4 py-4 text-[14.5px] font-medium transition-colors"
        >
            Resources
        </button>

        <a href="#" class="px-4 py-4 text-[14.5px] font-medium text-slate hover:text-ink transition-colors">Pricing</a>

        <!-- Stripe-like moving underline -->
        <div
            x-show="open"
            x-transition.opacity.duration.150ms
            class="absolute bottom-0 h-[2px] bg-blurple rounded-full"
            :style="indicatorStyle"
        ></div>

        <div class="ml-auto flex items-center gap-3 py-4">
            <a href="#" class="text-[14.5px] font-medium text-slate hover:text-ink transition-colors">Sign in</a>
            <a href="#" class="text-[14.5px] font-medium bg-ink text-white px-4 py-2 rounded-full hover:bg-ink/90 transition-colors">Contact sales</a>
        </div>
    </div>

    <!-- Backdrop dim -->
    <div
        x-show="open"
        x-transition.opacity.duration.200ms
        @click="close(true)"
        class="fixed inset-0 top-[65px] bg-ink/5 backdrop-blur-[1px] -z-10"
        style="display: none;"
    ></div>

    <!-- Floating Mega Menu Card -->
    <div
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @mouseenter="clearTimeout(closeTimer)"
        class="absolute left-0 top-full w-full pointer-events-none"
        style="display: none;"
    >
        <div
            class="relative bg-white shadow-[0_20px_50px_-12px_rgba(10,37,64,0.18)] rounded-2xl border border-hair overflow-hidden pointer-events-auto"
            :style="cardStyle"
        >
            <div id="mega-content" class="h-full">
                <div class="p-10 text-faint">Hover a menu item…</div>
            </div>
        </div>
    </div>
</nav>

<!-- Demo page body -->
<main class="max-w-6xl mx-auto px-6 py-24 text-center">
    <h1 class="text-4xl font-semibold text-ink tracking-tight">A mega menu, done properly</h1>
    <p class="mt-3 text-slate max-w-lg mx-auto">Hover Products, Solutions, or Resources above. Position, size, and content all morph in one continuous motion.</p>
</main>

<script>
  function megaMenu() {
    return {
        open: false,
        active: null,
        closeTimer: null,

        x: 0,
        y: 0,
        width: 600,
        height: 300,

        indicatorX: 0,
        indicatorWidth: 0,

        icon(name) {
            const icons = {
                crm: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="3"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>',
                analytics: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
                payments: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>',
                billing: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>',
                connect: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="6" r="3"/><circle cx="17" cy="18" r="3"/><path d="M9.5 10.8 14.5 7.7M9.5 13.2l5 3.1"/></svg>',
                radar: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M12 12 17 8"/></svg>',
                enterprise: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 21V8l7-4 7 4v13M10 21v-6h4v6"/></svg>',
                startup: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 2c3 3 4 6 4 9a4 4 0 0 1-8 0c0-3 1-6 4-9Z"/><path d="M8 17c-2 1-3 2.5-3 4.5M16 17c2 1 3 2.5 3 4.5"/></svg>',
                marketplace: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>',
                docs: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
                blog: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>',
                support: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.9.4-1.5 1-1.5 2.2M12 17h.01"/></svg>',
            };
            return icons[name] || '';
        },

        templates: {
            products: {
                w: 760, h: 380,
                html: (self) => `
                <div class="fade-in grid grid-cols-[1.6fr_1fr] h-full">
                    <div class="p-8 grid grid-cols-2 gap-1">
                        ${[
                            ['crm', 'CRM', 'Track deals and customers in one place'],
                            ['analytics', 'Analytics', 'Real-time metrics on revenue and usage'],
                            ['payments', 'Payments', 'Accept cards, wallets, and bank transfers'],
                            ['billing', 'Billing', 'Recurring invoices and subscription logic'],
                            ['connect', 'Connect', 'Payments for multi-sided marketplaces'],
                            ['radar', 'Radar', 'Fraud detection powered by machine learning'],
                        ].map(([icon, title, desc]) => `
                        <a href="#" class="item-row group flex items-start gap-3 rounded-xl p-3 hover:bg-wash">
                            <span class="item-icon shrink-0 grid place-items-center w-9 h-9 rounded-lg bg-blurple/10 text-blurple">${self.icon(icon)}</span>
                            <span class="flex-1 min-w-0">
                                <span class="flex items-center gap-1 text-[14px] font-medium text-ink">${title}
                                    <svg class="arrow opacity-0 group-hover:opacity-100" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                                </span>
                                <span class="block text-[12.5px] text-faint leading-snug mt-0.5">${desc}</span>
                            </span>
                        </a>`).join('')}
                    </div>
                    <div class="bg-gradient-to-br from-[#635BFF] to-[#4A3FE0] p-8 flex flex-col justify-between text-white">
                        <div>
                            <p class="text-[11px] font-semibold uppercase tracking-wide text-white/70">Featured</p>
                            <p class="mt-2 text-[17px] font-semibold leading-snug">Launch pricing plans without writing checkout code</p>
                            <p class="mt-2 text-[13px] text-white/80 leading-relaxed">See how Billing handles trials, proration, and dunning automatically.</p>
                        </div>
                        <a href="#" class="inline-flex items-center gap-1 text-[13.5px] font-medium">
                            Read the guide
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </a>
                    </div>
                </div>`
            },
            solutions: {
                w: 560, h: 260,
                html: (self) => `
                <div class="fade-in p-8 grid grid-cols-3 gap-1 h-full">
                    ${[
                        ['enterprise', 'Enterprise', 'Scale on infrastructure built for volume'],
                        ['startup', 'Startups', 'Get running in an afternoon, not a quarter'],
                        ['marketplace', 'Marketplaces', 'Split payments across many sellers'],
                    ].map(([icon, title, desc]) => `
                    <a href="#" class="item-row group flex flex-col gap-2 rounded-xl p-3 hover:bg-wash">
                        <span class="item-icon w-9 h-9 grid place-items-center rounded-lg bg-blurple/10 text-blurple">${self.icon(icon)}</span>
                        <span class="text-[14px] font-medium text-ink">${title}</span>
                        <span class="text-[12.5px] text-faint leading-snug">${desc}</span>
                    </a>`).join('')}
                </div>`
            },
            resources: {
                w: 480, h: 220,
                html: (self) => `
                <div class="fade-in p-8 grid grid-cols-3 gap-1 h-full">
                    ${[
                        ['docs', 'Docs', 'API reference and integration guides'],
                        ['blog', 'Blog', 'Product updates and engineering notes'],
                        ['support', 'Support', 'Talk to a human, day or night'],
                    ].map(([icon, title, desc]) => `
                    <a href="#" class="item-row group flex flex-col gap-2 rounded-xl p-3 hover:bg-wash">
                        <span class="item-icon w-9 h-9 grid place-items-center rounded-lg bg-blurple/10 text-blurple">${self.icon(icon)}</span>
                        <span class="text-[14px] font-medium text-ink">${title}</span>
                        <span class="text-[12.5px] text-faint leading-snug">${desc}</span>
                    </a>`).join('')}
                </div>`
            }
        },

        load(section, el) {
            clearTimeout(this.closeTimer);
            this.open = true;
            this.active = section;

            const rect = el.getBoundingClientRect();
            const navRect = el.closest('nav').getBoundingClientRect();

            this.indicatorX = rect.left - navRect.left;
            this.indicatorWidth = rect.width;

            const cfg = this.templates[section];

            // clamp card so it never overflows the viewport on the right
            const maxX = Math.max(0, navRect.width - cfg.w);
            this.x = Math.min(rect.left - navRect.left, maxX);
            this.y = 12;
            this.width = cfg.w;
            this.height = cfg.h;

            const target = document.getElementById('mega-content');
            if (target) {
                Alpine.morph(target, `<div id="mega-content" class="h-full">${cfg.html(this)}</div>`);
            }
        },

        scheduleClose() {
            this.closeTimer = setTimeout(() => this.close(false), 220);
        },

        close(immediate) {
            const doClose = () => { this.open = false; this.active = null; };
            if (immediate) { clearTimeout(this.closeTimer); doClose(); }
            else { doClose(); }
        },

        get cardStyle() {
            return `
                transform: translate(${this.x}px, ${this.y}px);
                width: ${this.width}px;
                height: ${this.height}px;
                transition:
                    transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            `;
        },

        get indicatorStyle() {
            return `
                transform: translateX(${this.indicatorX}px);
                width: ${this.indicatorWidth}px;
                transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            `;
        }
    };
  }
</script>
</body>
</html>

  <style>
    .editor::before {
      content: attr(data-placeholder);
      background: linear-gradient(90deg, #57534F 0%, #8E5EFE 40%, #65567A 60%, #A855F7 100%);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      position: absolute;
      display: none;
      top: 0;
      left: 0;
      width: 100%;
      white-space: pre-wrap;
      word-wrap: break-word;
      z-index: 1;
      animation: gradientShift 2s ease-in-out infinite alternate;
    }

    .editor.empty::before {
      display: block;
    }

    .editor-placeholder {
      position: absolute;
      top: 0;
      left: 0;
       background: linear-gradient(90deg, #57534F 0%, #8E5EFE 40%, #65567A 60%, #A855F7 100%);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: pre;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity .2s ease;
       animation: gradientShift 2s ease-in-out infinite alternate;
    }

    .editor-placeholder.visible {
      opacity: 1;
    }

    .editor {
      position: relative;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      25% {
        background-position: 50% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      75% {
        background-position: 75% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>

  <script>
   function slashCommand() {
    return {
        show: false,
        search: '',

        init() {
            this.updateEmptyState();

            this.$refs.editor.addEventListener('input', () => {
                this.updateEmptyState();

                const text = this.$refs.editor.innerText;
                const match = text.match(/(^|[\s\n])\/([^\s]*)$/);
                const editor = this.$refs.editor;

                if (match) {
                    this.show = true;
                    this.search = match[2] || '';
                    editor.classList.add('slash-active');
                    editor.classList.toggle('has-search', !!this.search);
                    this.updateSecondaryPlaceholder();
                } else {
                    this.show = false;
                    this.search = '';
                    editor.classList.remove('slash-active', 'has-search');
                    this.$refs.secondaryPlaceholder.classList.remove('visible');
                }
            });

            this.$refs.editor.addEventListener('blur', () => {
                this.updateEmptyState();
                this.$refs.secondaryPlaceholder.classList.remove('visible');
            });

            this.$refs.editor.addEventListener('click', () => {
                if (this.show) this.updateSecondaryPlaceholder();
            });

            this.$refs.editor.addEventListener('keyup', () => {
                if (this.show) this.updateSecondaryPlaceholder();
            });

            this.$refs.editor.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    this.show = false;
                    this.search = '';
                    this.$refs.editor.classList.remove('slash-active', 'has-search');
                    this.$refs.secondaryPlaceholder.classList.remove('visible');
                }
            });
        },

        updateEmptyState() {
            const isEmpty = this.$refs.editor.innerText.trim() === '';
            this.$refs.editor.classList.toggle('empty', isEmpty);
        },

        updateSecondaryPlaceholder() {
            const placeholder = this.$refs.secondaryPlaceholder;
            const editor = this.$refs.editor;
            if (!this.show || this.search) {
                placeholder.classList.remove('visible');
                return;
            }

            const selection = window.getSelection();
            if (!selection || !selection.rangeCount) {
                placeholder.classList.remove('visible');
                return;
            }

            const range = selection.getRangeAt(0).cloneRange();
            range.collapse(true);
            let rect = range.getClientRects()[0];
            if (!rect) {
                rect = range.getBoundingClientRect();
            }
            if (!rect || rect.width === 0 && rect.height === 0) {
                placeholder.classList.remove('visible');
                return;
            }

            const editorRect = editor.getBoundingClientRect();
            const top = rect.top - editorRect.top + editor.scrollTop;
            const left = rect.left - editorRect.left + editor.scrollLeft;

            placeholder.style.top = `${top}px`;
            placeholder.style.left = `${left}px`;
            placeholder.textContent = editor.dataset.secondaryPlaceholder || 'Type to search';
            placeholder.classList.add('visible');
        },

        filteredCommands() {
            return this.commands.map(group => ({
                ...group,
                items: group.items.filter(item =>
                    item.label.toLowerCase().includes(this.search.toLowerCase())
                )
            })).filter(group => group.items.length > 0);
        },

        commands: [
            {
                group: 'Form Fields',
                items: [
                    { label: 'Text Field', shortcut: '' },
                    { label: 'Heading 1 (H1)', shortcut: '#' },
                    { label: 'Heading 2 (H2)', shortcut: '##' },
                    { label: 'Heading 3 (H3)', shortcut: '###' },
                    { label: 'Heading 4 (H4)', shortcut: '####' },
                    { label: 'Normal Text', shortcut: '' },
                ]
            },
            {
                group: 'Signing & Approval',
                items: [
                    { label: 'Signature', shortcut: '' },
                    { label: 'Initial', shortcut: '' },
                    { label: 'Stamp', shortcut: '' },
                    { label: 'Date', shortcut: '' },
                ]
            },
            {
                group: 'Content & Layout',
                items: [
                    { label: 'Quote / Blockquote', shortcut: '>' },
                    { label: 'Bullet List', shortcut: '-' },
                    { label: 'Number List', shortcut: '1.' },
                    { label: 'Table', shortcut: '' },
                    { label: 'Image', shortcut: '' },
                    { label: 'Divider', shortcut: '' },
                    { label: '2 Columns', shortcut: '' },
                    { label: '3 Columns', shortcut: '' },
                    { label: '4 Columns', shortcut: '' },
                ]
            },
        ]
    }
}
  </script>
  <script>
    function commentsFlow() {
    return {
        comments: [],
        activeComment: null,
        showComposer: false,
        draft: '',
        pinX: 0,
        pinY: 0,

        addComment(event) {
            const rect = event.currentTarget.getBoundingClientRect();

            this.pinX = ((event.clientX - rect.left) / rect.width) * 100;
            this.pinY = ((event.clientY - rect.top) / rect.height) * 100;

            this.showComposer = true;
            this.draft = '';
        },

        saveComment() {
            if (!this.draft.trim()) return;

            const id = Date.now();

            this.comments.push({
                id,
                x: this.pinX,
                y: this.pinY,
                text: this.draft,
                author: 'You',
                createdAt: new Date()
            });

            this.activeComment = id;
            this.showComposer = false;
        }
    }
}

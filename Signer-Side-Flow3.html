          </a>
          <div class="flex flex-col gap-2">
             <h1
            class="text-2xl text-Theme-black font-normal leading-[140%] text-center"
          >
           You Declined to sign
          </h1>
           <p class="text-sm font-inter-display leading-5 text-Theme-dark-gray max-w-[400px] text-center">You have declined the Non-Disclosure Agreement from John Doe.
Your access to this document has been removed.</p>
          </div>

        <div class="absolute bottom-6 left-0 right-0 flex justify-center">
          <a href="#" class="w-[150px] py-2 px-3 bg-[rgba(142,94,254,0.14)] rounded-lg text-sm font-inter-display-medium leading-5 text-Theme-purple text-center transition-all duration-500 hover:bg-[rgba(142,94,254,0.1)]">Open Agreed</a>
        </div>
        <button class="close-btn cursor-pointer absolute right-5 top-3.5 bg-[#EEEEEC] rounded-md">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.60156 0.601562L0.602103 8.60103M8.60103 8.60156L0.601562 0.602129" stroke="black" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>

      </button>
      </div>
    </div>

    <!-- MAIN JS-->
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <script src="assets/js/main.js"></script>
    <script>
      document.querySelectorAll(".password-wrapper").forEach((wrapper) => {
        const passwordInput = wrapper.querySelector(".password-input");
        const toggleBtn = wrapper.querySelector(".togglePassword");
        const eyeOpen = wrapper.querySelector(".eyeOpen");
        const eyeClosed = wrapper.querySelector(".eyeClosed");

        toggleBtn.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";

          if (isPassword) {
            eyeOpen.classList.replace("opacity-100", "opacity-0");
            eyeOpen.classList.replace("scale-100", "scale-0");

            eyeClosed.classList.replace("opacity-0", "opacity-100");
            eyeClosed.classList.replace("scale-0", "scale-100");
          } else {
            eyeOpen.classList.replace("opacity-0", "opacity-100");
            eyeOpen.classList.replace("scale-0", "scale-100");

            eyeClosed.classList.replace("opacity-100", "opacity-0");
            eyeClosed.classList.replace("scale-100", "scale-0");
          }
        });
      });
    </script>
  </body>
</html>
